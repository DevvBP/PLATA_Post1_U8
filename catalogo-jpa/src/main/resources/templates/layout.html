<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Catálogo de productos — Laboratorio Unidad 8 Spring Boot JPA">
    <title>Catálogo JPA</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:        #0f1117;
            --surface:   #1a1d27;
            --surface2:  #22263a;
            --accent:    #6c63ff;
            --accent2:   #a78bfa;
            --danger:    #f87171;
            --success:   #4ade80;
            --warning:   #fbbf24;
            --text:      #e2e8f0;
            --muted:     #94a3b8;
            --border:    #2d3154;
            --radius:    10px;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* NAV */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            gap: 2rem;
            height: 60px;
        }
        nav .brand {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent2);
            text-decoration: none;
            letter-spacing: .5px;
        }
        nav a {
            color: var(--muted);
            text-decoration: none;
            font-size: .95rem;
            padding: .3rem .6rem;
            border-radius: 6px;
            transition: color .2s, background .2s;
        }
        nav a:hover { color: var(--text); background: var(--surface2); }

        /* MAIN */
        main { max-width: 1100px; margin: 2.5rem auto; padding: 0 1.5rem; }

        /* HEADINGS */
        h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 1.5rem; color: var(--accent2); }
        h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 1rem; }

        /* ALERTS */
        .alert {
            padding: .85rem 1.2rem;
            border-radius: var(--radius);
            margin-bottom: 1.2rem;
            font-size: .95rem;
            border-left: 4px solid;
        }
        .alert-success { background: #14532d33; border-color: var(--success); color: var(--success); }
        .alert-danger  { background: #7f1d1d33; border-color: var(--danger);  color: var(--danger); }
        .alert-warning { background: #78350f33; border-color: var(--warning); color: var(--warning); }

        /* CARD */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.8rem;
            margin-bottom: 1.5rem;
        }

        /* TABLE */
        .table-wrapper { overflow-x: auto; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: .95rem;
        }
        thead tr { background: var(--surface2); }
        th {
            text-align: left;
            padding: .85rem 1rem;
            color: var(--muted);
            font-weight: 600;
            font-size: .85rem;
            text-transform: uppercase;
            letter-spacing: .5px;
            border-bottom: 1px solid var(--border);
        }
        td {
            padding: .85rem 1rem;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:hover { background: var(--surface2); transition: background .15s; }
        tbody tr:last-child td { border-bottom: none; }

        /* BADGES */
        .badge {
            display: inline-block;
            padding: .25rem .65rem;
            border-radius: 20px;
            font-size: .78rem;
            font-weight: 600;
        }
        .badge-purple { background: #4c1d9533; color: var(--accent2); }
        .badge-green  { background: #14532d33; color: var(--success); }

        /* BUTTONS */
        .btn {
            display: inline-flex;
            align-items: center;
            gap: .4rem;
            padding: .5rem 1.1rem;
            border-radius: var(--radius);
            font-size: .9rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            text-decoration: none;
            transition: opacity .2s, transform .1s;
        }
        .btn:hover { opacity: .85; transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn-primary  { background: var(--accent);  color: #fff; }
        .btn-success  { background: #16a34a;         color: #fff; }
        .btn-warning  { background: #d97706;         color: #fff; }
        .btn-danger   { background: #dc2626;         color: #fff; }
        .btn-secondary{ background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
        .btn-sm { padding: .35rem .8rem; font-size: .82rem; }

        /* FORM */
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; margin-bottom: .45rem; font-size: .9rem; color: var(--muted); font-weight: 500; }
        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: .65rem .9rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--bg);
            color: var(--text);
            font-size: .95rem;
            transition: border-color .2s;
        }
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent);
        }
        textarea { resize: vertical; min-height: 90px; }
        .field-error { color: var(--danger); font-size: .82rem; margin-top: .3rem; }
        .is-invalid { border-color: var(--danger) !important; }

        /* FLEX UTILS */
        .d-flex   { display: flex; }
        .gap-2    { gap: .5rem; }
        .gap-3    { gap: .75rem; }
        .mb-3     { margin-bottom: 1rem; }
        .mb-4     { margin-bottom: 1.5rem; }
        .justify-between { justify-content: space-between; }
        .align-center    { align-items: center; }
        .flex-wrap { flex-wrap: wrap; }

        /* FOOTER */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--muted);
            font-size: .82rem;
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
        }
        .empty-state svg { opacity: .3; margin-bottom: 1rem; }

        /* FILTER FORM */
        .filter-form {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 1.2rem 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            gap: 1rem;
            align-items: flex-end;
            flex-wrap: wrap;
        }
        .filter-form .form-group { margin-bottom: 0; }
        .filter-form label { margin-bottom: .3rem; }
    </style>
</head>
<body>

<nav>
    <a class="brand" href="/">&#9638; Catálogo JPA</a>
    <a href="/categorias">Categorías</a>
    <a href="/productos">Productos</a>
</nav>

<main th:fragment="content">
    <!-- Las páginas reemplazan este fragmento -->
</main>

<footer>
    Unidad 8 &mdash; Spring Boot &plus; JPA/Hibernate &middot; Brayan Plata &copy; 2025
</footer>

</body>
</html>
